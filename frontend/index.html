<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maven Roasters | 매출 비서</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="brand"><span class="mark" aria-hidden="true">M</span><div><strong>Maven Roasters</strong><small>Lower Manhattan</small></div></div><button id="access" class="secondary">접속 설정</button></header>
<main>
<section class="intro"><div><p class="eyebrow">MAVEN ROASTERS · SALES WORKSPACE</p><h1>카페 매출 비서</h1><p id="period">매출 기록을 불러오는 중…</p></div><span id="mode"></span></section>
<div id="notice" role="status" aria-live="polite"></div>
<section id="metrics" aria-label="매출 요약" class="metrics"></section>
<nav aria-label="업무 메뉴"><button data-view="chat" aria-pressed="true">매출 채팅</button><button data-view="sales" aria-pressed="false">데이터 관리</button><button data-view="history" aria-pressed="false">대화 기록</button></nav>
<div id="chat" class="columns">
<section class="card conversation"><div class="card-heading"><h2>매출 채팅</h2><button id="new-chat" class="secondary">새 대화</button></div>
<div id="messages" aria-live="polite"></div><p id="waiting" role="status" hidden>매출을 분석하는 중… 첫 요청은 서버 시작으로 지연될 수 있습니다.</p>
<form id="question"><label for="prompt">질문</label><div class="form-row"><input id="prompt" required maxlength="4000" placeholder="최근 7일 매출이 어떻게 달라졌어?"><button id="send">보내기</button></div></form>
</section>
<section class="card chart-card"><h2>일별 매출</h2><p id="chart-period"></p><canvas id="chart" width="640" height="260" role="img" aria-label="최근 일별 매출 그래프"></canvas><button id="suggest" class="secondary">최근 7일 매출 비교 질문</button></section>
</div>
<section id="sales" class="card" hidden><div class="card-heading"><h2>데이터 관리</h2><button id="export" class="secondary">CSV 다운로드</button></div>
<form id="sale-form"><div class="fields"><label>날짜<input id="date" type="date" required></label><label>일매출 (USD)<input id="value" type="number" min="0" max="1000000000" step="0.01" required></label><label>메모<input id="memo" maxlength="300" placeholder="매출 관련 메모"></label><button id="save-sale">추가</button><button type="button" id="cancel" class="secondary" hidden>취소</button></div></form>
<div class="scroll"><table><thead><tr><th>날짜</th><th>매출</th><th>메모</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div>
</section>
<section id="history" class="card" hidden><h2>대화 기록</h2><p>답변을 받으면 해당 시점의 대화가 자동 저장됩니다.</p><ul id="history-list"></ul></section>
</main>
<dialog id="access-dialog"><form id="access-form"><h2>접속 설정</h2><p>서버에 설정된 접속 토큰을 입력하세요.</p><label>접속 토큰<input id="token" type="password" autocomplete="off"></label><div class="form-row"><button>적용</button><button id="close-dialog" type="button" class="secondary">닫기</button></div></form></dialog>
<script src="app.js" type="module"></script>
</body>
</html>
